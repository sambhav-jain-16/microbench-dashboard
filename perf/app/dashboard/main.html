<!DOCTYPE html>
<html lang="en">
<head>
    <title>Microbenchmark Dashboard - Test List</title>
    <link rel="icon" href="https://www.cockroachlabs.com/favicon.ico"/>
    <link rel="stylesheet" href="./static/style.css"/>
    <style>
        .test-list {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        .test-list h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .search-container {
            margin-bottom: 20px;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: #2c5282;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .test-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            transition: all 0.2s ease;
        }
        .test-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        .test-card a {
            color: #2c5282;
            text-decoration: none;
            font-size: 1.1em;
            display: block;
            word-wrap: break-word;
            white-space: normal;
        }
        .test-card a:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #666;
        }
        .error {
            color: #e53e3e;
            padding: 20px;
            text-align: center;
            background: #fff5f5;
            border-radius: 4px;
            margin: 20px auto;
            max-width: 600px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body class="Dashboard">
    <header class="Dashboard-topbar">
        <h1>
            <a href="/">CockroachDB Roachperf Dashboard</a>
        </h1>
    </header>

    <div class="test-list">
        <h1>Available Benchmarks</h1>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search tests...">
        </div>
        <div id="test-grid" class="test-grid">
            <div class="loading">Loading tests...</div>
        </div>
    </div>

    <script>
        async function fetchTests() {
            try {
                const response = await fetch('./tests.json');
                if (!response.ok) {
                    throw new Error('Failed to fetch tests');
                }
                const data = await response.json();
                return data.tests;
            } catch (error) {
                console.error('Error fetching tests:', error);
                throw error;
            }
        }

        function createTestCard(testName) {
            const card = document.createElement('div');
            card.className = 'test-card';
            
            const link = document.createElement('a');
            link.href = `/dashboard/?benchmark=${encodeURIComponent(testName)}`;
            link.textContent = testName;
            link.title = testName; // Show full name on hover
            
            card.appendChild(link);
            return card;
        }

        function displayError(message) {
            const grid = document.getElementById('test-grid');
            grid.innerHTML = `
                <div class="error">
                    <p>Error: ${message}</p>
                    <p>Please try refreshing the page or contact support if the problem persists.</p>
                </div>
            `;
        }

        function filterTests(tests, searchTerm) {
            if (!searchTerm) return tests;
            const term = searchTerm.toLowerCase();
            return tests.filter(test => test.toLowerCase().includes(term));
        }

        function updateTestGrid(tests, searchTerm = '') {
            const grid = document.getElementById('test-grid');
            grid.innerHTML = ''; // Clear existing content
            
            const filteredTests = filterTests(tests, searchTerm);
            
            if (filteredTests.length === 0) {
                grid.innerHTML = '<div class="error">No tests found</div>';
                return;
            }

            filteredTests.forEach(test => {
                grid.appendChild(createTestCard(test));
            });
        }

        // Initialize the page
        let allTests = [];
        fetchTests()
            .then(tests => {
                allTests = tests;
                updateTestGrid(tests);
            })
            .catch(error => {
                displayError(error.message);
            });

        // Add search functionality
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            updateTestGrid(allTests, e.target.value);
        });
    </script>
</body>
</html>
